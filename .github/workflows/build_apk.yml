name: Build Android APK (No Android Studio Needed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Ensure Gradle Wrapper Exists
        run: |
          TARGET_DIR="."
          if [ -d "android" ]; then
            TARGET_DIR="android"
          fi
          mkdir -p "$TARGET_DIR/gradle/wrapper"
          if [ ! -f "$TARGET_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o "$TARGET_DIR/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ -f "$TARGET_DIR/gradlew" ]; then
            chmod +x "$TARGET_DIR/gradlew"
          fi

      - name: Build Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            gradle assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK as Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: NS-Guruji-App-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
