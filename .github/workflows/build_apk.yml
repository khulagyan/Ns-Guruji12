name: Build Android APK (No Android Studio Needed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Gradle Wrapper & Permissions
        run: |
          TARGET_DIR="."
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            TARGET_DIR="android"
          fi
          mkdir -p "$TARGET_DIR/gradle/wrapper"
          if [ ! -s "$TARGET_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fetching official gradle-wrapper.jar..."
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o "$TARGET_DIR/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f "$TARGET_DIR/gradlew" ] || [ $(wc -c < "$TARGET_DIR/gradlew") -lt 1000 ]; then
            echo "Fetching official gradlew script..."
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew" -o "$TARGET_DIR/gradlew"
          fi
          chmod +x "$TARGET_DIR/gradlew"

      - name: Ensure google-services.json Exists
        run: |
          JSON_CONTENT='{"project_info":{"project_number":"123456789000","project_id":"ns-guruji-app","storage_bucket":"ns-guruji-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789000:android:abcdef1234567890","android_client_info":{"package_name":"com.nsguruji.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyReplaceWithYourOwnFirebaseKey"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
          for dir in "android/app" "app" "."; do
            if [ -d "$dir" ] && [ -f "$dir/build.gradle.kts" ]; then
              if [ ! -f "$dir/google-services.json" ]; then
                echo "Creating google-services.json in $dir"
                echo "$JSON_CONTENT" > "$dir/google-services.json"
              fi
            fi
          done

      - name: Build Debug APK with Gradle
        run: |
          TARGET_DIR="."
          if [ -d "android" ] && [ -f "android/build.gradle.kts" ]; then
            TARGET_DIR="android"
          fi
          cd "$TARGET_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK as Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: NS-Guruji-App-APK
          path: |
            **/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
