name: Build Android APK (No Android Studio Needed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Gradle Wrapper & Permissions
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fetching official gradle-wrapper.jar..."
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f "gradlew" ] || [ $(wc -c < "gradlew") -lt 1000 ]; then
            echo "Fetching official gradlew script..."
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew" -o gradlew
          fi
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK as Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: NS-Guruji-App-APK
          path: |
            **/build/outputs/apk/debug/app-debug.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 14
